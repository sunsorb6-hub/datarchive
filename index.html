
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataArchive</title>

<style>
:root {
    --bg: #ffffff;
    --fg: #111111;
    --line: #bdbdbd;
    --muted: #777777;
    --selection: #dedede;
    --panel: #f2f2f2;
    --accent: #111111;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", monospace;
    font-size: 14px;
    transition: background .15s, color .15s;
}

button, input {
    font: inherit;
    color: inherit;
}

button {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 6px 12px;
    cursor: pointer;
}

button:hover {
    background: var(--selection);
}

input {
    background: var(--bg);
    color: var(--fg);
}

.hidden {
    display: none !important;
}

/* ================================
   THEMES
================================ */

body.theme-dark {
    --bg: #101010;
    --fg: #eeeeee;
    --line: #555555;
    --muted: #aaaaaa;
    --selection: #303030;
    --panel: #1c1c1c;
    --accent: #eeeeee;
}

/* RETRO CRT */

body.ui-retro {
    --bg: #030803;
    --fg: #8cff8c;
    --line: #286428;
    --muted: #559955;
    --selection: #173817;
    --panel: #071207;
    --accent: #8cff8c;

    font-family: "Courier New", monospace;
}

body.ui-retro button {
    background: #071207;
    color: #8cff8c;
    border-color: #286428;
}

body.ui-retro button:hover {
    background: #173817;
}

body.ui-retro input {
    background: #030803;
    color: #8cff8c;
}

body.ui-retro #terminal,
body.ui-retro #manager,
body.ui-retro #viewer {
    text-shadow: 0 0 4px rgba(100,255,100,.35);
}

body.ui-retro #terminal::after {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.12) 4px
    );
}

/* ARCHIVE UI */

body.ui-archive {
    --bg: #e7e7e7;
    --fg: #151515;
    --line: #888888;
    --muted: #555555;
    --selection: #c9d4df;
    --panel: #d5d5d5;
    --accent: #222222;

    font-family: Tahoma, Arial, sans-serif;
}

body.ui-archive.theme-dark {
    --bg: #202020;
    --fg: #eeeeee;
    --line: #666666;
    --muted: #aaaaaa;
    --selection: #39434c;
    --panel: #303030;
}

body.ui-archive #terminal {
    margin: 12px;
    min-height: calc(100vh - 24px);
    border: 2px solid var(--line);
    background: var(--bg);
}

body.ui-archive .header {
    background: var(--panel);
    border-bottom: 2px solid var(--line);
    padding: 12px;
}

body.ui-archive .input-line {
    background: var(--panel);
    padding: 12px;
}

body.ui-archive #output {
    padding: 12px;
    font-family: "Courier New", monospace;
}

body.ui-archive #manager {
    font-family: Tahoma, Arial, sans-serif;
}

/* ================================
   TERMINAL
================================ */

#terminal {
    min-height: 100vh;
    width: 100%;
    padding: 24px;
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 12px;
    margin-bottom: 24px;
    font-weight: bold;
}

#output {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    line-height: 1.55;
    min-width: 0;
}

.line {
    margin: 2px 0;
    overflow-wrap: anywhere;
}

.dim {
    color: var(--muted);
}

.error {
    color: #b00000;
}

body.ui-retro .error {
    color: #ff6666;
}

.input-line {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--fg);
    padding-top: 12px;
    margin-top: 16px;
    gap: 8px;
    min-width: 0;
}

#prompt {
    white-space: nowrap;
}

#command {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    min-width: 0;
}

/* ================================
   FILE MANAGER
================================ */

#manager {
    min-height: 100vh;
    width: 100%;
    padding: 18px;
    background: var(--bg);
    font-family: Tahoma, Arial, sans-serif;
    font-size: 12px;
}

.window {
    border: 1px solid var(--line);
    min-height: calc(100vh - 36px);
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.titlebar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    font-weight: bold;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
}

.menu span {
    cursor: pointer;
}

.menu span:hover {
    text-decoration: underline;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border-bottom: 1px solid var(--line);
}

.toolbar button {
    font-family: Tahoma, Arial, sans-serif;
    font-size: 12px;
}

.address {
    padding: 9px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 1px solid var(--line);
}

#address {
    flex: 1;
    width: 100%;
    min-width: 0;
    padding: 5px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: "Courier New", monospace;
}

.file-area {
    padding: 14px;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(145px, 100%), 1fr));
    align-content: start;
    gap: 5px;
    min-width: 0;
}

.file {
    padding: 10px;
    border: 1px solid transparent;
    cursor: default;
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.file:hover {
    border-color: var(--line);
}

.file.selected {
    background: var(--selection);
    border: 1px solid var(--line);
}

.file-name {
    margin-top: 6px;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.file-kind {
    color: var(--muted);
    font-size: 10px;
}

.statusbar {
    border-top: 1px solid var(--line);
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
}

/* ================================
   VIEWER
================================ */

#viewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--fg);
    z-index: 40;
    display: flex;
    flex-direction: column;
    padding: 20px;
    min-width: 0;
}

.viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 12px;
}

#viewer-content {
    flex: 1;
    overflow: auto;
    overflow-wrap: anywhere;
    word-break: break-word;
    padding: 20px 0;
    white-space: pre-wrap;
    line-height: 1.6;
    min-width: 0;
}

#viewer-content pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    max-width: 100%;
}

#viewer-content img {
    display: block;
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 1px solid var(--line);
    margin: auto;
}

.media-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 20px 0;
}

.media-player audio {
    width: min(100%, 600px);
}

.media-player video {
    width: min(100%, 900px);
    max-height: 70vh;
    background: black;
    border: 1px solid var(--line);
}

.media-label {
    font-weight: bold;
    overflow-wrap: anywhere;
    text-align: center;
}

/* ================================
   SETUP WINDOW
================================ */

#setup {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.55);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
}

.setup-window {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    width: min(100%, 520px);
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
}

.setup-title {
    padding: 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.setup-section {
    padding: 15px;
    border-bottom: 1px solid var(--line);
}

.setup-section h3 {
    margin: 0 0 12px;
    font-size: 13px;
}

.setup-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
}

.setup-options.ui-options {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.setup-option {
    border: 1px solid var(--line);
    padding: 12px 5px;
    text-align: center;
    cursor: pointer;
    background: var(--bg);
    color: var(--fg);
    min-width: 0;
}

.setup-option.active {
    background: var(--selection);
    border: 2px solid var(--fg);
}

.setup-option strong {
    display: block;
    margin-bottom: 5px;
}

.setup-option small {
    color: var(--muted);
    overflow-wrap: anywhere;
}

.setup-footer {
    padding: 12px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

@media(max-width: 600px) {
    #terminal {
        padding: 14px;
    }

    #manager {
        padding: 5px;
    }

    .file-area {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #viewer {
        padding: 12px;
    }
}

@media(max-width: 400px) {
    .file-area {
        grid-template-columns: minmax(0, 1fr);
    }

    .setup-options.ui-options {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body class="theme-light ui-classic">

<!-- TERMINAL -->

<div id="terminal">

    <div class="header">
        <span>DATAARCHIVE SYSTEM</span>
        <span id="connection">CONNECTING</span>
    </div>

    <div id="output"></div>

        <span id="prompt">A:\&gt;</span>
        <input id="command"
               type="text"
               autocomplete="off"

</div>

<!-- FILE MANAGER -->

<div id="manager" class="hidden">
    <div class="window">

<div id="viewer" class="hidden">
    <div class="viewer-header">
        <span id="viewer-title">FILE VIEWER</span>
        <button onclick="closeViewer()">CLOSE</button>
    </div>

    <div id="viewer-content"></div>
</div>

<!-- SETUP -->

<div id="setup" class="hidden">
    <div class="setup-window">

        <div class="setup-title">
            <span>DATAARCHIVE SETUP</span>
            <span>VERSION 1.2</span>
        </div>

        <div class="setup-section">
            <h3>DISPLAY THEME</h3>

            <div class="setup-options">
                <button class="setup-option"
                        id="theme-light"
                        onclick="setTheme('light')">
                    <strong>LIGHT</strong>
                    <small>White / Black</small>
                </button>

                <button class="setup-option"
                        id="theme-dark"
                        onclick="setTheme('dark')">
                    <strong>DARK</strong>
                    <small>Black / White</small>
                </button>
            </div>
        </div>

        <div class="setup-section">
            <h3>USER INTERFACE</h3>

            <div class="setup-options ui-options">

                <button class="setup-option"
                        id="ui-classic"
                        onclick="setUI('classic')">
                    <strong>CLASSIC</strong>
                    <small>Minimal</small>
                </button>

                <button class="setup-option"
                        id="ui-retro"
                        onclick="setUI('retro')">
                    <strong>RETRO CRT</strong>
                    <small>Green phosphor</small>
                </button>

                <button class="setup-option"
                        id="ui-archive"
                        onclick="setUI('archive')">
                    <strong>ARCHIVE</strong>
                    <small>Classic system</small>
                </button>

            </div>
        </div>

        <div class="setup-footer">
            <button onclick="closeSetup()">CLOSE</button>
        </div>

    </div>
</div>

<script>

/* =====================================
   GITHUB CONFIGURATION
===================================== */

const GITHUB_OWNER = "sunsorb6-hub";
const GITHUB_REPO = "datarchive";
const GITHUB_BRANCH = "main";

/* =====================================
   VIRTUAL FILE SYSTEM
===================================== */

const FS = {};

const output = document.getElementById("output");
const input = document.getElementById("command");
const prompt = document.getElementById("prompt");

let currentPath = [];
let history = [];
let historyIndex = 0;
let tabMatches = [];
let tabIndex = 0;
let managerHistory = [];
let selectedFile = null;

/* =====================================
   SETTINGS
===================================== */

function loadSettings() {
    let theme = "light";
    let ui = "classic";

    try {
        theme = localStorage.getItem("da_theme") || "light";
        ui = localStorage.getItem("da_ui") || "classic";
    } catch (error) {}

    if (!["light", "dark"].includes(theme)) theme = "light";
    if (!["classic", "retro", "archive"].includes(ui)) ui = "classic";

    document.body.classList.remove("theme-light", "theme-dark");
    document.body.classList.remove("ui-classic", "ui-retro", "ui-archive");

    document.body.classList.add("theme-" + theme);
    document.body.classList.add("ui-" + ui);

    updateSetupSelection();
}

function saveSetting(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (error) {
        print("WARNING: SETTINGS COULD NOT BE SAVED.", "error");
    }
}

function setTheme(theme) {
    if (!["light", "dark"].includes(theme)) return;

    document.body.classList.remove("theme-light", "theme-dark");
    document.body.classList.add("theme-" + theme);

    saveSetting("da_theme", theme);
    updateSetupSelection();
}

function setUI(ui) {
    if (!["classic", "retro", "archive"].includes(ui)) return;

    document.body.classList.remove(
        "ui-classic",
        "ui-retro",
        "ui-archive"
    );

    document.body.classList.add("ui-" + ui);

    saveSetting("da_ui", ui);
    updateSetupSelection();
}

function updateSetupSelection() {
    const theme = document.body.classList.contains("theme-dark")
        ? "dark" : "light";

    const ui = ["classic", "retro", "archive"].find(
        name => document.body.classList.contains("ui-" + name)
    ) || "classic";

    document.getElementById("theme-light").classList.toggle(
        "active", theme === "light"
    );

    document.getElementById("theme-dark").classList.toggle(
        "active", theme === "dark"
    );

    ["classic", "retro", "archive"].forEach(name => {
        document.getElementById("ui-" + name).classList.toggle(
            "active", ui === name
        );
    });
}

function openSetup() {
    document.getElementById("setup").classList.remove("hidden");
    updateSetupSelection();
}

function closeSetup() {
    document.getElementById("setup").classList.add("hidden");
}

/* =====================================
   GITHUB ARCHIVE SCANNER
===================================== */

async function loadArchive() {
    const status = document.getElementById("connection");
    status.textContent = "SCANNING...";

    const base =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`;

    const branchResponse = await fetch(
        `${base}/branches/${GITHUB_BRANCH}`
    );

    if (!branchResponse.ok) {
        throw new Error("BRANCH ERROR: HTTP " + branchResponse.status);
    }

    const branchData = await branchResponse.json();
    const treeSHA = branchData.commit.commit.tree.sha;

    const treeResponse = await fetch(
        `${base}/git/trees/${treeSHA}?recursive=1`
    );

    if (!treeResponse.ok) {
        throw new Error("TREE ERROR: HTTP " + treeResponse.status);
    }

    const data = await treeResponse.json();

    if (data.truncated) {
        throw new Error("ARCHIVE TREE IS TOO LARGE.");
    }

    for (const key of Object.keys(FS)) {
        delete FS[key];
    }

    function createDirectory(parent, name) {
        if (!parent[name] || parent[name].type !== "dir") {
            parent[name] = {
                type: "dir",
                children: {}
            };
        }

        return parent[name];
    }

    for (const entry of data.tree) {
        if (!entry.path.startsWith("A/")) continue;

        const relative = entry.path.slice(2);
        if (!relative) continue;

        const parts = relative.split("/");
        const filename = parts.pop();

        let parent = FS;

        for (const folder of parts) {
            const directory = createDirectory(parent, folder);
            parent = directory.children;
        }

        if (relative.toLowerCase() === "logs/mission.txt") {
            continue;
        }

        if (entry.type === "tree") {
            createDirectory(parent, filename);
            continue;
        }

        if (entry.type !== "blob") continue;

        const extension = filename.split(".").pop().toLowerCase();

        const imageExtensions = [
            "png", "jpg", "jpeg", "gif", "webp"
        ];

        const audioExtensions = [
            "mp3", "wav"
        ];

        const videoExtensions = [
            "mp4"
        ];

        let type = "file";

        if (imageExtensions.includes(extension)) {
            type = "image";
        } else if (audioExtensions.includes(extension)) {
            type = "audio";
        } else if (videoExtensions.includes(extension)) {
            type = "video";
        }

        parent[filename] = {
            type: type,
            path: relative
        };
    }

    // Preserve the locked mission entry.
    const logs = createDirectory(FS, "logs");

    logs.children["mission.txt"] = {
        type: "locked"
    };

    status.textContent = "ONLINE";

    return true;
}

/* =====================================
   PATH UTILITIES
===================================== */

function getDirectory(path = currentPath) {
    let node = {
        type: "dir",
        children: FS
    };

    for (const part of path) {
        if (!node.children || !node.children[part]) return null;
        node = node.children[part];
    }

    return node;
}

function getNode(path) {
    if (path.length === 0) {
        return { type: "dir", children: FS };
    }

    const parent = getDirectory(path.slice(0, -1));

    return parent?.children?.[path[path.length - 1]] || null;
}


/* =====================================
   GENERAL UTILITIES
===================================== */

function currentLocation() {
    return "A:\\" + currentPath.join("\\") +
           (currentPath.length ? "\\" : "");
}

function updatePrompt() {
    prompt.textContent = currentLocation() + ">";
}

function print(text = "", className = "") {
    const line = document.createElement("div");
    line.className = "line " + className;
    line.textContent = text;
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
}

function clearOutput() {
    output.innerHTML = "";
}

function getDirectory(path = currentPath) {
    let node = { type: "dir", children: FS };

    for (const part of path) {
        if (!node.children || !node.children[part]) return null;
        node = node.children[part];
    }

    return node;
}

function getNode(path) {
    if (path.length === 0) {
        return { type: "dir", children: FS };
    }

    const parent = getDirectory(path.slice(0, -1));
    return parent?.children?.[path[path.length - 1]] || null;
}

function findChild(name) {
    const dir = getDirectory();
    if (!dir) return null;

    const key = Object.keys(dir.children).find(
        k => k.toLowerCase() === name.toLowerCase()
    );

    return key ? { name: key, node: dir.children[key] } : null;
}

/* =====================================
   FILE OPENING
===================================== */

let activeObjectURL = null;

async function openFile(name, node) {
    if (node.type === "locked") {
        print("ACCESS DENIED.", "error");
        print("INSUFFICIENT PERMISSIONS.", "error");
        return;
    }

    if (node.type === "dir") {
        currentPath.push(name);
        updatePrompt();
        print(currentLocation());
        return;
    }

    const path = "A/" + node.path;

    try {
        const response = await fetch(path);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        if (node.type === "image" ||
            node.type === "audio" ||
            node.type === "video") {

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            if (activeObjectURL) {
                URL.revokeObjectURL(activeObjectURL);
            }

            activeObjectURL = url;

            if (node.type === "image") {
                showImage(name, url);
            } else if (node.type === "audio") {
                showAudio(name, url);
            } else {
                showVideo(name, url);
            }

        } else {
            const text = await response.text();
            showText(name, text);
        }

    } catch (error) {
        print("ERROR: UNABLE TO READ FILE.", "error");
        print(error.message, "dim");
    }
}

function prepareViewer(title) {
    document.getElementById("viewer-title").textContent = title;

    const content = document.getElementById("viewer-content");
    content.replaceChildren();

    document.getElementById("viewer").classList.remove("hidden");

    return content;
}

function showText(name, text) {
    const content = prepareViewer("FILE: " + name);

    const pre = document.createElement("pre");
    pre.style.margin = "0";
    pre.style.fontFamily = "Courier New, monospace";
    pre.textContent = text;

    content.appendChild(pre);
}

function showImage(name, url) {
    const content = prepareViewer("IMAGE: " + name);

    const img = document.createElement("img");
    img.src = url;
    img.alt = name;

    content.appendChild(img);

    img.addEventListener("error", () => {
        print("ERROR: IMAGE COULD NOT BE DISPLAYED.", "error");
        closeViewer();
    });
}

function showAudio(name, url) {
    const content = prepareViewer("AUDIO: " + name);

    const player = document.createElement("div");
    player.className = "media-player";

    const label = document.createElement("div");
    label.className = "media-label";
    label.textContent = name;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "metadata";
    audio.src = url;

    player.append(label, audio);
    content.appendChild(player);
}

function showVideo(name, url) {
    const content = prepareViewer("VIDEO: " + name);

    const player = document.createElement("div");
    player.className = "media-player";

    const label = document.createElement("div");
    label.className = "media-label";
    label.textContent = name;

    const video = document.createElement("video");
    video.controls = true;
    video.preload = "metadata";
    video.playsInline = true;
    video.src = url;

    player.append(label, video);
    content.appendChild(player);
}

function closeViewer() {
    const content = document.getElementById("viewer-content");

    content.querySelectorAll("audio, video").forEach(media => {
        media.pause();
        media.removeAttribute("src");
        media.load();
    });

    if (activeObjectURL) {
        URL.revokeObjectURL(activeObjectURL);
        activeObjectURL = null;
    }

    content.replaceChildren();
    document.getElementById("viewer").classList.add("hidden");
}

/* =====================================
   TERMINAL COMMANDS
===================================== */

function execute(raw) {
    const command = raw.trim();
    if (!command) return;

    print(currentLocation() + "> " + command, "dim");

    const lower = command.toLowerCase();

    if (lower === "help") {
        print("AVAILABLE COMMANDS:");
        print("DIR       - LIST DIRECTORY CONTENTS");
        print("CD [DIR]  - CHANGE DIRECTORY");
        print("CD ..     - GO TO PARENT DIRECTORY");
        print("DRIVE     - DISPLAY AVAILABLE DRIVES");
        print("CLS       - CLEAR TERMINAL");
        print("MOUSE     - OPEN FILE MANAGER");
        print("SETUP     - OPEN SYSTEM SETTINGS");
        print("TERMINAL  - RETURN TO TERMINAL");
        print("HELP      - DISPLAY THIS MESSAGE");
        print("");
        print("TYPE A FILE OR DIRECTORY NAME TO OPEN IT.");
        return;
    }

    if (lower === "cls" || lower === "clear") {
        clearOutput();
        return;
    }

    if (lower === "drive") {
        print("AVAILABLE DRIVES:");
        print("A:\\  DATAARCHIVE STORAGE");
        return;
    }

    if (lower === "mouse") {
        switchToManager();
        return;
    }

    if (lower === "terminal") {
        switchToTerminal();
        return;
    }

    if (lower === "setup") {
        openSetup();
        return;
    }

    if (lower === "dir" || lower === "ls") {
        const dir = getDirectory();
        if (!dir) return;

        print("DIRECTORY OF " + currentLocation());
        print("");

        for (const [name, node] of Object.entries(dir.children)) {
            print((node.type === "dir" ? "<DIR> " : "      ") + name);
        }

        print("");
        print(Object.keys(dir.children).length + " OBJECT(S)");
        return;
    }

    if (lower === "cd .." || lower === "..") {
        if (currentPath.length) currentPath.pop();
        updatePrompt();
        return;
    }

    if (lower === "cd") {
        print("USAGE: CD [DIRECTORY]", "error");
        return;
    }

    /* Directory navigation */
    if (lower.startsWith("cd ")) {
        const target = command.slice(3).trim();
        const parts = target.replaceAll("/", "\\")
                            .split("\\")
                            .filter(Boolean);

        let path = [...currentPath];

        if (parts[0]?.toLowerCase() === "a:") {
            path = [];
            parts.shift();
        }

        for (const part of parts) {
            if (part === "..") {
                path.pop();
                continue;
            }

            const parent = getDirectory(path);
            const key = parent && Object.keys(parent.children).find(
                k => k.toLowerCase() === part.toLowerCase()
            );

            if (!key || parent.children[key].type !== "dir") {
                print("DIRECTORY NOT FOUND.", "error");
                return;
            }

            path.push(key);
        }

        currentPath = path;
        updatePrompt();
        print("DIRECTORY CHANGED.");
        return;
    }

    /* File or directory path */
    const parts = command.replaceAll("/", "\\")
                         .split("\\")
                         .filter(Boolean);

    let node = null;
    let path = [...currentPath];

    if (parts[0]?.toLowerCase() === "a:") {
        path = [];
        parts.shift();
    }

    let failed = false;

    for (const part of parts) {
        if (part === "..") {
            path.pop();
            continue;
        }

        const parent = getDirectory(path);

        if (!parent) {
            failed = true;
            break;
        }

        const key = Object.keys(parent.children).find(
            k => k.toLowerCase() === part.toLowerCase()
        );

        if (!key) {
            failed = true;
            break;
        }

        node = parent.children[key];
        path.push(key);
    }

    if (failed || !node) {
        print("COMMAND OR FILE NOT FOUND.", "error");
        return;
    }

    const name = path[path.length - 1];

    if (node.type === "dir") {
        currentPath = path;
        updatePrompt();
        print("DIRECTORY OPENED.");
        return;
    }

    openFile(name, node);
}

/* =====================================
   INPUT & HISTORY
===================================== */

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        const value = input.value;
        input.value = "";

        if (value.trim()) {
            history.push(value);
            historyIndex = history.length;
        }

        tabMatches = [];
        tabIndex = 0;
        execute(value);
        return;
    }

    if (event.key === "ArrowUp") {
        event.preventDefault();

        if (historyIndex > 0) {
            historyIndex--;
            input.value = history[historyIndex];
        }
        return;
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();

        if (historyIndex < history.length - 1) {
            historyIndex++;
            input.value = history[historyIndex];
        } else {
            historyIndex = history.length;
            input.value = "";
        }
        return;
    }

    if (event.key === "Tab") {
        event.preventDefault();
        autocomplete();
    }

    if (event.key === "Escape") {
        input.value = "";
    }
});

/* =====================================
   TAB AUTOCOMPLETION
===================================== */

function autocomplete() {
    const value = input.value;
    const prefix = value.toLowerCase();

    if (!tabMatches.length || tabIndex === 0) {
        const dir = getDirectory();

        if (!dir) return;

        tabMatches = Object.keys(dir.children).filter(
            name => name.toLowerCase().startsWith(prefix)
        );

        tabIndex = 0;
    }

    if (!tabMatches.length) {
        print("NO MATCHING FILES.", "dim");
        return;
    }

    if (tabMatches.length === 1) {
        input.value = tabMatches[0];
        tabMatches = [];
        tabIndex = 0;
        return;
    }

    input.value = tabMatches[tabIndex % tabMatches.length];
    tabIndex++;

    if (tabIndex >= tabMatches.length) {
        print("MATCHES: " + tabMatches.join("  "));
        tabIndex = 0;
    }
}

input.addEventListener("input", () => {
    tabMatches = [];
    tabIndex = 0;
});

/* =====================================
   FILE MANAGER
===================================== */

function switchToManager() {
    document.getElementById("terminal").classList.add("hidden");
    document.getElementById("manager").classList.remove("hidden");
    refreshManager();
}

function switchToTerminal() {
    document.getElementById("manager").classList.add("hidden");
    document.getElementById("terminal").classList.remove("hidden");
    input.focus();
}

function refreshManager() {
    const dir = getDirectory();
    if (!dir) return;

    const area = document.getElementById("file-area");
    area.innerHTML = "";

    document.getElementById("address").value = currentLocation();

    for (const [name, node] of Object.entries(dir.children)) {
        const item = document.createElement("div");
        item.className = "file";

        let kind = "[TEXT FILE]";

        if (node.type === "dir") kind = "[DIRECTORY]";
        if (node.type === "locked") kind = "[LOCKED]";
        if (node.type === "image") kind = "[IMAGE]";
        if (node.type === "audio") kind = "[AUDIO]";
        if (node.type === "video") kind = "[VIDEO]";

        const label = document.createElement("div");
        label.textContent = kind;

        const filename = document.createElement("div");
        filename.className = "file-name";
        filename.textContent = name;

        const type = document.createElement("div");
        type.className = "file-kind";
        type.textContent = node.type.toUpperCase();

        item.append(label, filename, type);

        item.addEventListener("click", () => {
            document.querySelectorAll(".file").forEach(f =>
                f.classList.remove("selected")
            );

            item.classList.add("selected");
            selectedFile = name;
        });

        item.addEventListener("dblclick", () => {
            openFile(name, node).then(() => {
                if (node.type === "dir") refreshManager();
            });
        });

        area.appendChild(item);
    }

    document.getElementById("file-count").textContent =
        Object.keys(dir.children).length + " OBJECTS";
}

function goParent() {
    if (currentPath.length) {
        managerHistory.push([...currentPath]);
        currentPath.pop();
        refreshManager();
    }
}

function goBack() {
    if (managerHistory.length) {
        currentPath = managerHistory.pop();
        refreshManager();
    } else {
        goParent();
    }
}

function showMenu(menu) {
    if (menu === "Help") {
        alert("DATAARCHIVE FILE MANAGER\nVERSION 1.2");
    } else if (menu === "View") {
        refreshManager();
    } else if (menu === "File") {
        if (selectedFile) {
            const found = findChild(selectedFile);
            if (found) openFile(found.name, found.node);
        }
    }
}

/* =====================================
   STARTUP
===================================== */

async function startup() {
    loadSettings();

    print("DATAARCHIVE SYSTEM");
    print("VERSION 1.2");
    print("");
    print("CONNECTING TO ARCHIVE...");
    print("");

    updatePrompt();

    try {
        await loadArchive();

        print("ARCHIVE STORAGE: ONLINE");
        print("DRIVE A: READY");
        print("");
        print("ARCHIVE INDEX LOADED.");
        print("TYPE 'HELP' TO BEGIN.");

    } catch (error) {
        document.getElementById("connection").textContent = "ERROR";

        print("ARCHIVE CONNECTION FAILED.", "error");
        print(error.message, "error");
        print("CHECK GITHUB CONNECTION AND TRY AGAIN.");
    }
}

startup();
updatePrompt();
